<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Project | Flavors</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;500;700;900&display=swap');

:root {
    --bg-color: #080808;
    --text-color: #ffffff;
    --accent-primary: #ffffff;
    --accent-secondary: #ffffff;
    --glass-bg: rgba(255, 255, 255, 0.02);
    --glass-border: rgba(255, 255, 255, 0.05);
    --font-main: 'Inter', sans-serif;
    --font-heading: 'Outfit', sans-serif;
    --section-padding: 8rem 2rem;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
}

html {
    background-color: var(--bg-color);
}

body {
    background-color: transparent !important;
    color: var(--text-color);
    font-family: var(--font-main);
    overflow-x: hidden;
    line-height: 1.6;
}

.site-wrapper {
    position: relative;
    z-index: 10;
}

h1, h2, h3 {
    font-family: var(--font-heading);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
}

/* Glassmorphism Utility */
.glass {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
}

/* Hero Section */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    padding: 0 1rem;
    overflow: hidden;
    background: transparent;
}

#three-canvas-container, #bg-video, #vimeo-background-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1; /* In front of HTML background, behind site-wrapper */
    pointer-events: none;
    object-fit: cover;
}

.hero-content {
    position: relative;
    z-index: 10; /* Above video and 3D */
}

.hero h1 {
    font-size: clamp(3rem, 10vw, 8rem);
    line-height: 0.9;
    background: linear-gradient(to bottom, #ffffff, transparent);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2rem;
}

.hero p {
    font-size: 1.2rem;
    color: rgba(255,255,255,0.6);
    max-width: 600px;
    margin-bottom: 3rem;
}

/* Buttons */
.btn-primary {
    background: #fff;
    color: #000;
    padding: 1rem 2.5rem;
    border-radius: 100px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
}

.btn-primary:hover {
    transform: scale(1.05);
}

/* Section Transitions */
.reveal {
    opacity: 0;
    transform: translateY(30px);
    animation: safetyReveal 1s forwards;
    animation-delay: 2s; /* Forced reveal if GSAP fails */
}

@keyframes safetyReveal {
    to { opacity: 1; transform: translateY(0); }
}

/* Mesh Background */
.mesh-gradient {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -200; /* Deep background to never block video */
    background: 
        radial-gradient(circle at 20% 20%, rgba(0, 255, 204, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 255, 0.15) 0%, transparent 40%);
}

/* Card Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    padding: var(--section-padding);
}

/* Split Layout (The WOW Layout) */
.split-layout {
    display: flex !important;
    flex-direction: row !important;
    text-align: left !important;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
}

.hero-left {
    flex: 1.2;
    padding-left: 8%;
    z-index: 10;
}

.hero-right {
    flex: 1;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

#three-canvas-container {
    width: 100%;
    height: 100%;
}

.card {
    padding: 3rem;
    transition: border-color 0.3s ease;
}

/* Custom Cursor Logic (Corrected) */
.custom-cursor {
    position: fixed;
    width: 20px;
    height: 20px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid var(--accent-primary);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
}

/* Noise Overlay */
.noise-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.05; 
    background: url('https://grainy-gradients.vercel.app/noise.svg');
}

/* Custom Cursor */
.custom-cursor {
    position: fixed;
    width: 20px;
    height: 20px;
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid var(--accent-primary);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
}
</style>
</head>
<body class="page-flavors">
    <div class="mesh-gradient"></div>
    <div class="site-wrapper">
        <nav style="position: fixed; top: 2rem; width: 100%; display: flex; justify-content: center; gap: 2rem; z-index: 10001;"></nav>
        
<div id="shader-background-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -100; pointer-events: none;"></div>
<section class="hero full-layout" id="hero" style="background: transparent !important;">
    <div class="noise-overlay"></div>
    <div class="hero-content">
        <h1 class="reveal">ABSTRACT LIQUID</h1>
        <p class="reveal">Testing the code-based generative fire shader.</p>
        <div class="reveal">
            <a href="#" class="btn-primary">Get Started</a>
        </div>
    </div>
</section>
<button onclick="diagnoseVisuals()" style="position: fixed; bottom: 1rem; right: 1rem; z-index: 10002; background: rgba(255,255,255,0.1); color: white; border: 1px solid white; padding: 0.5rem; border-radius: 5px; cursor: pointer;">Diagnostic</button>

        
<div class="noise-overlay"></div>
<section class="grid">
    
<div class="card glass reveal">
    <h3>Indestructible</h3>
    <p>100% reliable GPU simulation.</p>
</div>

<div class="card glass reveal">
    <h3>Interactive</h3>
    <p>Flows with your motion.</p>
</div>

</section>

        
<footer style="padding: 4rem 2rem; text-align: center; color: rgba(255,255,255,0.4); border-top: 1px solid var(--glass-border);">
    <p>&copy; 2026 AETHER_ANIMUS | Built for Aether Project</p>
</footer>

    </div>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
    gsap.registerPlugin(ScrollTrigger);

    // Three.js Scene Setup
    const container = document.getElementById('three-canvas-container');
    if (container) {
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Dynamic Geometry Selection (WOW Factor)
        const geometries = {
            "SPHERE": new THREE.IcosahedronGeometry(2, 1),
            "TORUS": new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16),
            "PLANE": new THREE.PlaneGeometry(5, 5, 32, 32),
            "OCTA": new THREE.OctahedronGeometry(2, 0),
            "RING": new THREE.TorusGeometry(2, 0.5, 16, 100)
        };
        const geoType = "[[geometry_type]]";
        const geometry = geometries[geoType] || geometries["SPHERE"];
        
        const material = new THREE.MeshPhongMaterial({
            color: "[[accent_primary_hex]]",
            wireframe: true,
            transparent: true,
            opacity: 0.9,
            emissive: "[[accent_primary_hex]]",
            emissiveIntensity: 0.6
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        const light = new THREE.PointLight(0xffffff, 4, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x += 0.005;
            sphere.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // Mouse Interactivity for Three.js
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            gsap.to(sphere.rotation, { y: x, x: -y, duration: 2 });
        });

        // Scroll Parallax for Three.js
        gsap.to(sphere.position, {
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1
            },
            z: -5,
            y: 2
        });
    }

    // Liquid Fire Shader (The "WOWER" Guarantee)
    const shaderContainer = document.getElementById('shader-background-container');
    if (shaderContainer) {
        const s_scene = new THREE.Scene();
        const s_camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const s_renderer = new THREE.WebGLRenderer({ antialias: true });
        s_renderer.setSize(window.innerWidth, window.innerHeight);
        shaderContainer.appendChild(s_renderer.domElement);

        const s_material = new THREE.ShaderMaterial({
            uniforms: { time: { value: 1.0 }, resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) } },
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                uniform float time;
                uniform vec2 resolution;
                float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
                float noise(vec2 p) {
                    vec2 i = floor(p); vec2 f = fract(p);
                    vec2 u = f*f*(3.0-2.0*f);
                    return mix(mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                               mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
                }
                void main() {
                    vec2 uv = gl_FragCoord.xy / resolution.xy;
                    float n = noise(uv * 4.0 + time * 0.5);
                    vec3 fire = mix(vec3(0.8, 0.1, 0.0), vec3(1.0, 0.6, 0.1), n);
                    gl_FragColor = vec4(fire * (1.0 - uv.y) * 1.5, 1.0);
                }
            `
        });
        const s_mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), s_material);
        s_scene.add(s_mesh);

        function s_animate(t) {
            requestAnimationFrame(s_animate);
            s_material.uniforms.time.value = t * 0.001;
            s_renderer.render(s_scene, s_camera);
        }
        s_animate(0);
        
        window.addEventListener('resize', () => {
            s_renderer.setSize(window.innerWidth, window.innerHeight);
            s_material.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        });
    }

    // AETHER_IGNIS_ULTIMA (The Mesmerising Realistic Fix)
    const realisticFire = document.getElementById('realistic-fire-container');
    if (realisticFire) {
        const rf_scene = new THREE.Scene();
        const rf_camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const rf_renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        rf_renderer.setPixelRatio(window.devicePixelRatio);
        rf_renderer.setSize(window.innerWidth, window.innerHeight);
        realisticFire.appendChild(rf_renderer.domElement);

        const rf_material = new THREE.ShaderMaterial({
            uniforms: { 
                time: { value: 1.0 }, 
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                mouse: { value: new THREE.Vector2(0.5, 0.5) }
            },
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                uniform float time;
                uniform vec2 resolution;
                uniform vec2 mouse;
                
                vec3 firePalette(float t) {
                    vec3 a = vec3(0.5, 0.5, 0.5);
                    vec3 b = vec3(0.5, 0.5, 0.5);
                    vec3 c = vec3(1.0, 1.0, 1.0);
                    vec3 d = vec3(0.00, 0.10, 0.20);
                    return a + b * cos(6.28318 * (c * t + d));
                }

                float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                float noise(vec2 p) {
                    vec2 i = floor(p); vec2 f = fract(p);
                    vec2 u = f*f*(3.0-2.0*f);
                    return mix(mix(hash(i + vec2(0.,0.)), hash(i + vec2(1.,0.)), u.x),
                               mix(hash(i + vec2(0.,1.)), hash(i + vec2(1.,1.)), u.x), u.y);
                }

                void main() {
                    vec2 uv = gl_FragCoord.xy / resolution.xy;
                    vec2 q = uv;
                    q.y -= time * 0.6; // Faster, more energetic
                    
                    float T3 = 1.6 * noise(q * 3.0);
                    float T2 = 1.2 * noise(q * 6.0 + T3);
                    float T1 = 0.8 * noise(q * 12.0 + T2);
                    float f = T1 + T2 + T3;
                    
                    f *= (1.0 - uv.y) * 3.0; // Sharper taper
                    f = clamp(f, 0.0, 1.0);
                    
                    // RAZOR SHARP STEPS (No more blur)
                    vec3 fireColor = mix(vec3(0.0), vec3(1.0, 0.2, 0.0), smoothstep(0.2, 0.25, f));
                    fireColor = mix(fireColor, vec3(1.0, 0.6, 0.0), smoothstep(0.4, 0.45, f));
                    fireColor = mix(fireColor, vec3(1.0, 1.0, 0.5), smoothstep(0.7, 0.72, f));
                    
                    // High Contrast Bloom
                    fireColor *= 1.5;
                    
                    // Mouse Distortion (Crystal Clear)
                    float dist = distance(uv, mouse);
                    if (dist < 0.2) {
                        fireColor *= 1.2;
                    }
                    
                    gl_FragColor = vec4(fireColor, 1.0);
                }
            `
        });
        rf_scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), rf_material));
        
        window.addEventListener('mousemove', (e) => {
            rf_material.uniforms.mouse.value.x = e.clientX / window.innerWidth;
            rf_material.uniforms.mouse.value.y = 1.0 - (e.clientY / window.innerHeight);
        });

        function rf_animate(t) {
            requestAnimationFrame(rf_animate);
            rf_material.uniforms.time.value = t * 0.001;
            rf_renderer.render(rf_scene, rf_camera);
        }
        rf_animate(0);
        window.addEventListener('resize', () => {
            rf_renderer.setSize(window.innerWidth, window.innerHeight);
            rf_material.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        });
    }

    // REDUNDANT FIRE ENGINE (The "Indestructible" Logic)
    const fallbackContainer = document.getElementById('kinetic-fallback-container');
    const videoIframe = document.getElementById('bg-video-iframe');
    
    // Timeout to check if video is playing
    let videoLoaded = false;
    setTimeout(() => {
        if (!videoLoaded) {
            console.log("Video timeout: Triggering Kinetic Fallback.");
            triggerFallback();
        }
    }, 4000);

    function triggerFallback() {
        if (fallbackContainer && window.FIRE_BG) {
            fallbackContainer.style.display = "block";
            const kf_scene = new THREE.Scene();
            const kf_camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const kf_renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            kf_renderer.setSize(window.innerWidth, window.innerHeight);
            fallbackContainer.appendChild(kf_renderer.domElement);

            const loader = new THREE.TextureLoader();
            loader.load(window.FIRE_BG, (texture) => {
                const material = new THREE.ShaderMaterial({
                    uniforms: { time: { value: 1.0 }, uTexture: { value: texture }, resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) } },
                    vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
                    fragmentShader: `
                        uniform float time;
                        uniform sampler2D uTexture;
                        uniform vec2 resolution;
                        float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
                        float noise(vec2 p) {
                            vec2 i = floor(p); vec2 f = fract(p);
                            vec2 u = f*f*(3.0-2.0*f);
                            return mix(mix(hash(i + vec2(0.,0.)), hash(i + vec2(1.,0.)), u.x),
                                       mix(hash(i + vec2(0.,1.)), hash(i + vec2(1.,1.)), u.x), u.y);
                        }
                        void main() {
                            vec2 uv = gl_FragCoord.xy / resolution.xy;
                            vec4 baseColor = texture2D(uTexture, uv);
                            float brightness = length(baseColor.rgb);
                            float isFire = smoothstep(0.4, 0.8, brightness);
                            float distortion = noise(uv * 10.0 + time * 0.8) * 0.012 * isFire;
                            vec2 distortedUV = uv + vec2(distortion, distortion - time * 0.015 * isFire);
                            gl_FragColor = texture2D(uTexture, distortedUV);
                        }
                    `
                });
                kf_scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
                function kf_animate(t) {
                    requestAnimationFrame(kf_animate);
                    material.uniforms.time.value = t * 0.001;
                    kf_renderer.render(kf_scene, kf_camera);
                }
                kf_animate(0);
            });
        }
    }

    // Initial Reveal Animations
    gsap.to(".reveal", {
        opacity: 1,
        y: 0,
        duration: 1.5,
        stagger: 0.15,
        ease: "expo.out",
        delay: 0.2
    });

    // Stunning Card Entrances
    gsap.utils.toArray(".card").forEach((card, i) => {
        gsap.from(card, {
            scrollTrigger: {
                trigger: card,
                start: "top 95%",
                toggleActions: "play none none none"
            },
            opacity: 0,
            scale: 0.8,
            rotationY: 15,
            duration: 1.2,
            delay: i * 0.1,
            ease: "back.out(1.7)"
        });
    });

    // Robust Scroll Reveal (Final Fix for disappearing bug)
    gsap.utils.toArray(".reveal, section, .card").forEach(el => {
        gsap.set(el, { opacity: 0, y: 30 }); // Ensure initial state
        ScrollTrigger.create({
            trigger: el,
            start: "top 95%",
            onEnter: () => gsap.to(el, { opacity: 1, y: 0, duration: 1.2, ease: "power4.out" })
        });
    });

    // Magnetic Cursor Logic (WOW Factor)
    const cursor = document.createElement('div');
    cursor.className = 'custom-cursor';
    document.body.appendChild(cursor);

    window.addEventListener('mousemove', (e) => {
        gsap.to(cursor, {
            x: e.clientX,
            y: e.clientY,
            duration: 0.6,
            ease: "power2.out"
        });
    });

    document.querySelectorAll('.btn-primary, .card').forEach(el => {
        el.addEventListener('mouseenter', () => gsap.to(cursor, { scale: 3, backgroundColor: "var(--accent-primary)", opacity: 0.3 }));
        el.addEventListener('mouseleave', () => gsap.to(cursor, { scale: 1, backgroundColor: "transparent", opacity: 1 }));
    });

    function diagnoseVisuals() {
        const video = document.getElementById('bg-video');
        const shader = document.getElementById('shader-background-container');
        const realistic = document.getElementById('realistic-fire-container');
        if (realistic) {
            alert(`Sentry Diagnostic:\n- Realistic Shader Active: ${realistic.offsetWidth}x${realistic.offsetHeight}\n- Z-Index: ${realistic.style.zIndex}`);
        } else if (shader) {
            alert(`Sentry Diagnostic:\n- Abstract Shader Active: ${shader.offsetWidth}x${shader.offsetHeight}\n- Z-Index: ${shader.style.zIndex}`);
        } else {
            alert("Sentry Diagnostic: NO BACKGROUND ELEMENT FOUND.");
        }
    }
</script>

</body>
</html>
